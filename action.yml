name: 'Depos: обновление зависимостей OneScript'
description: 'Обновляет зависимости в файле packagedef и создает Pull Request с изменениями'
author: Stivo182

inputs:
  packagedef:
    description: Относительный путь к файлу packagedef или каталогу, содержащему его
    required: false
    default: packagedef
  filter:
    description: Фильтр пакетов по именам (через запятую или пробел), шаблону (*, ?) или регулярному выражению
    required: false
  target:
    description: Тип целевой версии (latest, minor, patch)
    required: false
    default: latest
  engine:
    description: Целевая версия OneScript для совместимых обновлений (auto, current или номер версии)
    required: false
  depos-version:
    description: Версия depos для установки через opm
    required: false
    default: 0.8.0
  base:
    description: Базовая ветка Pull Request. Если не указана, используется ветка по умолчанию репозитория
    required: false
  message-prefix:
    description: Префикс для сообщения коммита и заголовка Pull Request
    required: false
    default: build(deps)
  branch:
    description: Имя ветки Pull Request. Для основной базы используется depos/bump-deps/<target>, для другой базы добавляется /<base>
    required: false
  labels:
    description: Метки Pull Request, разделённые запятой или переводом строки
    required: false
    default: dependencies
  token:
    description: Токен для создания и обновления Pull Request
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Установка OneScript
      uses: otymko/setup-onescript@v1.5.1
      with:
        version: stable

    - name: Установка зависимостей (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        opm install opm
        opm install -l

    - name: Установка зависимостей (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Set-Location -LiteralPath $env:GITHUB_ACTION_PATH
        opm install opm
        opm install -l

    - name: Проверка входных параметров
      shell: bash
      env:
        DEPOS_TARGET: ${{ inputs.target }}
        DEPOS_PACKAGEDEF: ${{ inputs.packagedef }}
        DEPOS_BRANCH: ${{ inputs.branch }}
        DEPOS_BASE: ${{ inputs.base }}
        DEPOS_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        DEPOS_TRIGGER_REF_NAME: ${{ github.ref_name }}
      run: oscript "$GITHUB_ACTION_PATH/src/depos-action.os" prepare

    - name: Актуализация
      uses: actions/checkout@v7.0.1
      with:
        ref: ${{ env.DEPOS_BASE }}
        persist-credentials: false
        clean: false

    - name: Определение файла packagedef
      shell: bash
      run: oscript "$GITHUB_ACTION_PATH/src/depos-action.os" resolve-packagedef

    - name: Обновление зависимостей в packagedef
      shell: bash
      env:
        DEPOS_FILTER: ${{ inputs.filter }}
        DEPOS_TARGET: ${{ inputs.target }}
        DEPOS_ENGINE: ${{ inputs.engine }}
        DEPOS_VERSION: ${{ inputs.depos-version }}
      run: oscript "$GITHUB_ACTION_PATH/src/depos-action.os" upgrade

    - name: Проверка наличия изменений
      id: check-changes
      shell: bash
      run: |
        set -u
        if ! changes="$(git status --porcelain -- "$DEPOS_PACKAGEDEF")"; then
          echo "::error title=Ошибка проверки изменений::Не удалось получить состояние packagedef." >&2
          exit 1
        fi
        if [[ -n "$changes" ]]; then
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Подготовка Pull Request
      if: steps.check-changes.outputs.has_changes == 'true'
      id: format-output
      shell: bash
      env:
        DEPOS_MESSAGE_PREFIX: ${{ inputs.message-prefix }}
        GH_TOKEN: ${{ inputs.token }}
        DEPOS_TARGET: ${{ inputs.target }}
        DEPOS_ENGINE: ${{ inputs.engine }}
      run: oscript "$GITHUB_ACTION_PATH/src/depos-action.os" format-pr

    - name: Закрытие ранее созданного PR (если изменений нет)
      if: steps.check-changes.outputs.has_changes == 'false'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
      run: oscript "$GITHUB_ACTION_PATH/src/depos-action.os" cleanup-pr

    - name: Проверка ветки Pull Request
      if: steps.check-changes.outputs.has_changes == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
      run: oscript "$GITHUB_ACTION_PATH/src/depos-action.os" check-branch

    - name: Создание Pull Request
      if: steps.check-changes.outputs.has_changes == 'true'
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ inputs.token }}
        title: ${{ steps.format-output.outputs.title }}
        commit-message: ${{ steps.format-output.outputs.title }}
        body: ${{ steps.format-output.outputs.body }}
        committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
        author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
        add-paths: ${{ env.DEPOS_PACKAGEDEF }}
        branch: ${{ env.DEPOS_BRANCH }}
        base: ${{ env.DEPOS_BASE }}
        labels: ${{ inputs.labels }}
