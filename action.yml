name: 'Depos: обновление зависимостей OneScript'
description: 'Обновляет зависимости в файле packagedef и создает Pull Request с изменениями'
author: Stivo182

inputs:
  packagedef:
    description: Относительный путь к файлу packagedef или каталогу, содержащему его
    required: false
    default: packagedef
  filter:
    description: Фильтр пакетов по именам (через запятую или пробел), шаблону (*, ?) или регулярному выражению
    required: false
  target:
    description: Тип целевой версии (latest, minor, patch)
    required: false
    default: latest
  depos-version:
    description: Версия depos для установки через opm. Если не указана, используется закреплённая версия Action
    required: false
  base:
    description: Базовая ветка Pull Request. Если не указана, используется ветка по умолчанию репозитория
    required: false
  message-prefix:
    description: Префикс для сообщения коммита и заголовка Pull Request
    required: false
    default: build(deps)
  branch:
    description: Имя ветки Pull Request. Для основной базы используется depos/bump-deps/<target>, для другой базы добавляется /<base>
    required: false
  labels:
    description: Метки Pull Request, разделённые запятой или переводом строки
    required: false
    default: dependencies
  token:
    description: Токен для создания и обновления Pull Request
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Проверка входных параметров
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        TARGET: ${{ inputs.target }}
        PACKAGEDEF: ${{ inputs.packagedef }}
        BRANCH: ${{ inputs.branch }}
        BASE: ${{ inputs.base }}
        DEFAULT_BASE: ${{ github.event.repository.default_branch }}
        CURRENT_REF: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        bash "$ACTION_PATH/scripts/prepare.sh"

    - name: Актуализация
      uses: actions/checkout@v6.0.1
      with:
        ref: ${{ env.DEPOS_BASE }}
        persist-credentials: false
        clean: false

    - name: Установка OneScript
      uses: otymko/setup-onescript@v1.5.1
      with:
        version: stable

    - name: Определение файла packagedef
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        PACKAGEDEF: ${{ env.DEPOS_PACKAGEDEF }}
      run: |
        set -euo pipefail
        bash "$ACTION_PATH/scripts/resolve-packagedef.sh"

    - name: Обновление зависимостей в packagedef
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        PACKAGEDEF: ${{ env.DEPOS_PACKAGEDEF }}
        FILTER: ${{ inputs.filter }}
        TARGET: ${{ inputs.target }}
        DEPOS_VERSION: ${{ inputs.depos-version }}
        OUTPUT: ${{ env.DEPOS_REPORT_PATH }}
      run: |
        set -euo pipefail
        bash "$ACTION_PATH/scripts/upgrade.sh"

    - name: Проверка наличия изменений
      id: check-changes
      shell: bash
      run: |
        set -euo pipefail

        if [[ -n "$(git status --porcelain -- "$DEPOS_PACKAGEDEF")" ]]; then
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Подготовка Pull Request
      if: steps.check-changes.outputs.has_changes == 'true'
      id: format-output
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        MESSAGE_PREFIX: ${{ inputs.message-prefix }}
        REPORT: ${{ env.DEPOS_REPORT_PATH }}
        GH_TOKEN: ${{ inputs.token }}
        TARGET: ${{ inputs.target }}
        DEPOS_PACKAGEDEF: ${{ env.DEPOS_PACKAGEDEF }}
      run: |
        set -euo pipefail
        cd "$ACTION_PATH"
        opm install -l
        oscript scripts/format-pr.os

    - name: Закрытие ранее созданного PR (если изменений нет)
      if: steps.check-changes.outputs.has_changes == 'false'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        bash "$ACTION_PATH/scripts/cleanup-pr.sh"

    - name: Создание Pull Request
      if: steps.check-changes.outputs.has_changes == 'true'
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ inputs.token }}
        title: ${{ steps.format-output.outputs.title }}
        commit-message: ${{ steps.format-output.outputs.title }}
        body: ${{ steps.format-output.outputs.body }}
        committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
        author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
        add-paths: ${{ env.DEPOS_PACKAGEDEF }}
        branch: ${{ env.DEPOS_BRANCH }}
        base: ${{ env.DEPOS_BASE }}
        labels: ${{ inputs.labels }}
