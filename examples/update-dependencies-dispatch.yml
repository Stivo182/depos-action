name: Обновление зависимостей

on:
  workflow_dispatch:
    inputs:
      filter:
        description: Фильтр пакетов
      target:
        description: Тип версии
        default: latest
        type: choice
        options:
          - latest
          - minor
          - patch
      engine:
        description: Режим выбора версии OneScript
        default: auto
        type: choice
        options:
          - auto
          - current

permissions:
  contents: read

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Обновление зависимостей
        uses: Stivo182/depos-action@v2
        with:
          filter: ${{ inputs.filter }}
          target: ${{ inputs.target }}
          engine: ${{ inputs.engine }}
          token: ${{ secrets.PAT }}
