name: 'Depos: команда обновления зависимостей'
description: 'Обновляет зависимости в файле packagedef'
author: Stivo182

inputs:
  packagedef:
    description: Относительный путь к файлу packagedef или к каталогу, содержащему его
    required: false
    default: packagedef
  filter:
    description: Фильтр пакетов по именам (через запятую или пробел), шаблону (*, ?) или регулярному выражению
    required: false
  target:
    description: Тип целевой версии (latest, minor, patch)
    required: false
    default: latest
  engine:
    description: Целевая версия OneScript для совместимых обновлений (auto, current или номер версии)
    required: false
  depos-version:
    description: Версия depos для установки через opm
    required: false
    default: 0.8.0
  output:
    description: Путь для сохранения JSON-отчёта об обновлениях.
    required: false

runs:
  using: composite
  steps:
    - name: Установка зависимостей (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH/.."
        opm install opm
        opm install -l

    - name: Установка зависимостей (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Set-Location -LiteralPath (Split-Path -Parent $env:GITHUB_ACTION_PATH)
        opm install opm
        opm install -l

    - name: Обновление зависимостей в packagedef
      shell: bash
      env:
        DEPOS_PACKAGEDEF: ${{ inputs.packagedef }}
        DEPOS_FILTER: ${{ inputs.filter }}
        DEPOS_TARGET: ${{ inputs.target }}
        DEPOS_ENGINE: ${{ inputs.engine }}
        DEPOS_VERSION: ${{ inputs.depos-version }}
        DEPOS_REPORT_PATH: ${{ inputs.output }}
      run: oscript "$GITHUB_ACTION_PATH/../src/depos-action.os" upgrade
