name: 'Depos: команда обновления зависимостей'
description: 'Обновляет зависимости в файле packagedef'
author: Stivo182

inputs:
  packagedef:
    description: Путь к файлу packagedef или его каталогу.
    required: false
    default: packagedef
  filter:
    description: Фильтр пакетов по именам (через запятую или пробел), шаблону (*, ?) или регулярному выражению.
    required: false
  target:
    description: Тип целевой версии (latest, minor, patch).
    required: false
    default: latest
  depos-version:
    description: Версия depos для установки через opm. Если не указана, используется закреплённая версия Action.
    required: false
  output:
    description: Путь для сохранения JSON-отчёта об обновлениях.
    required: false

runs:
  using: composite
  steps:
    - name: Установка OneScript
      uses: otymko/setup-onescript@v1.5.1
      with:
        version: stable

    - name: Обновление зависимостей в packagedef
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        PACKAGEDEF: ${{ inputs.packagedef }}
        FILTER: ${{ inputs.filter }}
        TARGET: ${{ inputs.target }}
        DEPOS_VERSION: ${{ inputs.depos-version }}
        OUTPUT: ${{ inputs.output }}
      run: |
        set -euo pipefail
        bash "$ACTION_PATH/../scripts/upgrade.sh"
